<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the AI Poem Generator</h1>
    </header>

    <main>
      <form>
        <input
          type="text"
          placeholder="Enter a topic for a poem"
          required
          autofocus
        />
        <input type="submit" />
      </form>

      <div>
        The first line of poem
        <br />
        The second line of poem
      </div>
    </main>

    <footer>
      This was coded by
      <a href="https://github.com/ewilson001500-tech" target="_blank"
        >Erin Wilson
      </a>
      and is open-sourced on
      <a
        href="https://github.com/ewilson001500-tech/Poem-Generator"
        target="_blank"
        >GitHub</a
      >
      and is hosted on
      <a href="https://ew-poem-generator.netlify.app/" target="_blank"
        >Netlify</a
      >.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
